# Development profile — activates the Kotlin DataSeederConfig
# Usage: ./gradlew bootRun --args='--spring.profiles.active=dev'
# Or:   SPRING_PROFILES_ACTIVE=dev ./gradlew bootRun

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# The DataSeederConfig runs only when the "dev" profile is active